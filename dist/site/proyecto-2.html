<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kit de Rescate Digital · Reparación y Soporte Técnico</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div id="app"></div><script src="assets/art.js"></script><script src="assets/app.js"></script><script src="assets/site.js"></script><script>window.PAGE={"type":"project","parent":"proyectos","id":"proyecto-2","n":2,"unitLabel":"Unidad 2","icon":"","title":"Kit de Rescate Digital","short":"Kit de recuperación","summary":"\"Todo problema tiene solución si estás preparado\"","goal":"Construir un kit de recuperación formado por un USB de rescate, una máquina virtual y una guía de reinstalación y respaldo, para resolver fallas de software y sistemas operativos de forma ordenada, segura y con software legal.","phases":[{"t":"FASE I: Reto","goal":"Plantear el caso de un usuario que perdió el acceso a su computadora y no tiene respaldo, para motivar la construcción de herramientas que permitan recuperar el sistema y los datos.","steps":["Presentación del caso: el equipo no arranca y el usuario no tiene copia de sus archivos.","Conversación guiada para identificar qué podría haber fallado: disco, sistema operativo, controladores o malware.","Análisis del problema: se necesita una forma ordenada y repetible de recuperar el equipo.","Formulación de la pregunta guía: ¿Qué herramientas necesita un técnico para recuperar un sistema y proteger los datos de un usuario?"],"eval":["Participación y análisis del caso (10 pts)."]},{"t":"FASE II: Investigación","goal":"Investigar cómo se instala, repara y respalda un sistema operativo, y dónde obtener herramientas de forma legal y oficial.","steps":["Investigación de las ISO oficiales de Windows y de una distribución Linux, y cómo verificar su descarga.","Funcionamiento del arranque desde USB y de la BIOS/UEFI.","Práctica de modo seguro, entorno de recuperación (WinRE) y comandos sfc y chkdsk.","Diferencia entre respaldo completo, incremental y la regla 3-2-1.","Selección de herramientas portátiles legales: CrystalDiskInfo, CPU-Z, MemTest86, 7-Zip y antivirus."],"eval":["Investigación y fuentes oficiales citadas (20 pts)."]},{"t":"FASE III: Creación","goal":"Crear el kit de rescate y la guía de reinstalación paso a paso, comprobando que cada parte funciona.","steps":["Creación de un USB multiarranque (Ventoy o Rufus) con instalador de Windows y una distribución Linux en modo Live.","Organización de una carpeta Herramientas con utilidades portátiles de fuentes oficiales.","Instalación y configuración de una máquina virtual en VirtualBox, documentada con capturas.","Simulación de una falla y recuperación del sistema con WinRE o una imagen.","Elaboración de un plan de respaldo 3-2-1 y prueba de restauración.","Redacción de una guía de reinstalación de mínimo 12 pasos con capturas."],"eval":["USB de rescate funcional (20 pts).","Máquina virtual e instalación (15 pts).","Guía de reinstalación (20 pts).","Respaldo y seguridad (10 pts)."]},{"t":"FASE IV: Presentación","goal":"Demostrar en vivo la recuperación de un equipo y comunicar con claridad el procedimiento seguido.","steps":["Demostración en vivo: simulación de una falla y recuperación con el kit.","Explicación de la guía y del plan de respaldo ante compañeros y docente.","Respuesta a preguntas sobre las decisiones técnicas y la legalidad del software utilizado.","Reflexión final sobre la importancia del respaldo y del software legal."],"eval":["Demostración y presentación (5 pts)."]}],"color":"#e07a2c","gallery":"galeria-2"};RST.render(PAGE,SITE,'site');</script></body></html>
