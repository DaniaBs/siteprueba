<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitácora del Técnico Responsable · Reparación y Soporte Técnico</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div id="app"></div><script src="assets/art.js"></script><script src="assets/app.js"></script><script src="assets/site.js"></script><script>window.PAGE={"type":"project","parent":"proyectos","id":"proyecto-1","n":1,"unitLabel":"Unidad 1","icon":"","title":"Bitácora del Técnico Responsable","short":"Mantenimiento preventivo","summary":"\"Un equipo cuidado dura más\"","goal":"Planificar y ejecutar el mantenimiento preventivo de un equipo del laboratorio, aplicando normas de seguridad, orden y limpieza, y documentar todo el proceso con una bitácora y evidencias, para desarrollar la responsabilidad, el método de trabajo y la comunicación técnica.","phases":[{"t":"FASE I: Reto","goal":"Plantear una situación real que motive a los estudiantes a cuidar el equipo de cómputo: el colegio debe revisar sus computadoras antes de iniciar el ciclo escolar y necesita un equipo de técnicos responsables.","steps":["Observación del estado de los equipos del laboratorio: polvo, cables, ruidos, temperaturas y rendimiento.","Conversación guiada sobre qué pasa cuando un equipo no recibe mantenimiento.","Organización de equipos de trabajo de 3 estudiantes y elección de la computadora a intervenir.","Formulación de la pregunta guía: ¿Cómo podemos dejar un equipo funcionando mejor y demostrar con evidencias lo que hicimos?"],"eval":["Participación y formación del equipo (10 pts)."]},{"t":"FASE II: Investigación","goal":"Investigar los fundamentos del mantenimiento preventivo, las normas de seguridad y las herramientas de diagnóstico, para tomar decisiones técnicas con criterio.","steps":["Investigación de las normas de seguridad: descarga electrostática (ESD), equipo desconectado y orden del puesto de trabajo.","Diferencia entre mantenimiento preventivo, correctivo y predictivo.","Revisión de los materiales y herramientas del kit: destornilladores, brocha, aire comprimido, alcohol isopropílico y pulsera antiestática.","Uso de programas de diagnóstico (CPU-Z, CrystalDiskInfo) para registrar el estado inicial del equipo.","Elaboración de la ficha técnica del equipo con hardware y software."],"eval":["Ficha técnica completa y correcta (20 pts).","Cumplimiento de las normas de seguridad (10 pts)."]},{"t":"FASE III: Creación","goal":"Ejecutar el mantenimiento del equipo y elaborar la bitácora, el plan anual de mantenimiento y un manual breve para el usuario.","steps":["Limpieza física interior y exterior del equipo, revisión de cables y conectores, y cambio de pasta térmica cuando sea necesario.","Mantenimiento lógico: actualizaciones, controladores y limpieza de archivos temporales.","Medición de temperaturas y salud del disco antes y después del mantenimiento.","Registro de actividades, tiempos y estado final en la bitácora, con fotografías de antes y después.","Redacción del plan de mantenimiento preventivo con calendario anual.","Elaboración de un manual con 10 consejos de cuidado para el usuario."],"eval":["Calidad técnica del mantenimiento (20 pts).","Bitácora y evidencias fotográficas (20 pts).","Plan de mantenimiento y manual (10 pts)."]},{"t":"FASE IV: Presentación","goal":"Comunicar de forma oral y digital el trabajo realizado, justificando las decisiones técnicas con las evidencias obtenidas.","steps":["Entrega del equipo funcionando junto con la bitácora y el plan de mantenimiento.","Presentación de 5 minutos por equipo explicando el procedimiento y los resultados antes y después.","Respuesta a preguntas de compañeros y docente sobre el proceso.","Reflexión final sobre la importancia de trabajar con seguridad, orden y limpieza."],"eval":["Presentación y trabajo en equipo (10 pts)."]}],"color":"#e07a2c","gallery":"galeria-1"};RST.render(PAGE,SITE,'site');</script></body></html>
